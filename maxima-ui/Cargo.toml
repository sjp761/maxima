[package]
name = "maxima-ui"
version = "0.1.0"
authors = ["Nick Whelan <cooldood909@gmail.com>"]
edition = "2021"

[dependencies]
maxima-lib = { path = "../maxima-lib" }
winapi = { version = "0.3.9", features = [ "memoryapi", "handleapi", "synchapi", "wincon", "consoleapi", "psapi", "wininet", "winerror", "iphlpapi", "tcpmib" ] }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
eframe = { version = "0.28.1", features = [ "persistence" ] }
egui = "0.28.1"
egui_extras = {version = "0.28.1", features = [ "svg", "all_loaders" ] }
image = { version = "0.24.9", features = [ "png", "jpeg" ] }
reqwest = { version = "0.11.27", features = ["stream", "rustls-tls"], default-features = false }
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4.29"
egui_demo_lib = "0.28.1"
puffin_http = "0.15.0"
puffin = "0.18.1"
strum = "0.25.0"
strum_macros = "0.25.3"
sys-locale = "0.3.2"
humansize = { version = "2.1.3", features = ["no_alloc"] }
fuzzy-matcher = "*"
thiserror = "2.0.18"

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1.2"

[build-dependencies]
maxima-resources = { path = "../maxima-resources" }

[[bin]]
name = "maxima"
path = "src/main.rs"
