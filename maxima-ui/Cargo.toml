[package]
name = "maxima-ui"
version = "0.1.0"
authors = ["Nick Whelan <cooldood909@gmail.com>"]
edition = "2024"

[dependencies]
maxima-lib = { path = "../maxima-lib" }
anyhow = { workspace = true }
clap = { workspace = true }
eframe = { version = "0.36.1", default-features = false, features = [ "persistence", "glow", "wayland", "x11" ] }
egui = "0.36.1"
egui_extras = {version = "0.36.1", features = [ "svg", "all_loaders" ] }
image = { version = "0.25.10", features = [ "png", "jpeg" ] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
puffin_http = "0.17.0"
puffin = "0.20.0"
rustls = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
sys-locale = "0.3.2"
humansize = { version = "2.1.3", features = ["no_alloc"] }
fuzzy-matcher = "0.3.7"
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
is_elevated = { workspace = true }

[build-dependencies]
maxima-resources = { path = "../maxima-resources" }

[[bin]]
name = "maxima"
path = "src/main.rs"
