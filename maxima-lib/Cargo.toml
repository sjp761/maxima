[package]
name = "maxima-lib"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
categories = ["games"]
description = "A free and open-source replacement for the EA Desktop Launcher"
keywords = ["electronic-arts", "linux-gaming"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/ArmchairDevelopers/Maxima"
documentation = "https://docs.rs/maxima"
rust-version = { workspace = true }

[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
scopeguard = "1.2.0"
tokio = { workspace = true }
moka = { version = "0.12.16", features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { version = "0.42.0", features = ["serialize"] }
pastey = "0.2.3"
hex = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "form", "query", "gzip", "json"] }
base64 = { workspace = true }
base62 = "2.2.4"
log = { workspace = true }
enable-ansi-support = "0.3.1"
chrono = "0.4.45"
regex = { workspace = true }
directories = { workspace = true }
open = "5.4.2"
ureq = { version = "3.4.0", features = ["rustls"] }
sysinfo = "0.39.6"
strum_macros = { workspace = true }
sha2 = "0.11.0"
tar = "0.4.46"
miniz_oxide = { version = "0.9.1", features = ["serde"] }
xz2 = "0.1.7"
zstd = "0.13.3"
toml = "1.1.4"
bytebuffer = "2.3.0"
derive-getters = "0.5.0"
derive_builder = "0.20.2"
mac_address = "1.1.8"
filetime = "0.2.29"
rand = "0.10.2"
ring = "0.17.14"
futures = { workspace = true }
prost = "0.14.4"
encoding_rs = "0.8.35"
tokio-util = { version = "0.7.19", features = ["io", "compat"] }
uuid = "1.25.0"
tokio-rustls = "0.26.4"
rustls = { workspace = true }
webpki-roots = "1.0.9"
aes = "0.9.2"
ecb = { version = "0.2.1", features = ["alloc", "block-padding", "zeroize"] }
cbc = { version = "0.2.1", features = ["alloc", "block-padding", "zeroize"] }
glob = "0.3.4"
md5 = "0.8.1"
bytes = "1.12.1"
async-trait = "0.1.92"
crc32fast = "1.5.1"
pelite = "0.10.0"
gethostname = "1.1.0"
thiserror = { workspace = true }
url = { workspace = true }
http = "1.5.0"
globset = "0.4.20"
generic-array = "1.4.5"
rustls-pki-types = "1.15.1"
tokio-stream = "0.1.19"
sha1 = "0.11.0"
libz-sys = "1.1.29"
anyhow = { workspace = true }
dirs = "6.0.0"
async-compression = { version = "0.4.42", features = ["tokio", "deflate"] }
flate2 = { version = "1.1.10", features = ["zlib"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_ProcessStatus",
    "Win32_Security_Authorization",
    "Win32_Security",
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
] }
winreg = { workspace = true }
windows-service = { workspace = true }
is_elevated = { workspace = true }
widestring = "1.2.1"
wmi = "0.18.4"

[target.'cfg(unix)'.dependencies]
which = "8.0"

[target.'cfg(target_os = "macos")'.dependencies]
smbios-lib = "0.9.4"

[build-dependencies]
prost-build = "0.14.4"

[lib]
name = "maxima"
path = "src/lib.rs"
