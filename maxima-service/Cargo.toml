[package]
name = "maxima-service"
version = "0.1.0"
authors = ["Sean Kahler <sean@battleda.sh>"]
edition = "2021"

[dependencies]
maxima-lib = { path = "../maxima-lib" }
tokio = { version = "1.52.3", features = [ "full", "rt", "rt-multi-thread", "time", "net" ] }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
paste = "1.0.15"
reqwest = { version = "0.11.27", features = ["stream", "rustls-tls"], default-features = false }
base64 = "0.21.7"
log = "0.4.29"
regex = "1.12.3"
directories = "5.0.1"
structured-logger = "1.0.5"
actix-web = "4.13.0"
sha2 = "0.10.9"
derive_more = "0.99.20"
hex = "0.4.3"
thiserror = "2.0.18"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [ "memoryapi", "handleapi", "synchapi", "wincon", "consoleapi" ] }
winreg = "0.50.0"
windows-service = "0.6.0"

[build-dependencies]
maxima-resources = { path = "../maxima-resources" }

[[bin]]
name = "maxima-service"
path = "src/main.rs"
