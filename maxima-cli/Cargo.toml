[package]
name = "maxima-cli"
version = "0.1.0"
authors = ["Sean Kahler <sean@battleda.sh>"]
edition = "2021"

[dependencies]
maxima-lib = { path = "../maxima-lib" }
clap = { version = "4.6.7", features = [ "derive" ] }
tokio = { version = "1.54.1", features = [ "full", "rt", "rt-multi-thread", "time", "net" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
anyhow = "1.0.104"
lazy_static = "1.5.1"
base64 = "0.23.1"
log = "0.4.34"
regex = "1.13.1"
inquire = "0.9.4"
futures = "0.3.34"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [ "memoryapi", "handleapi", "synchapi", "wincon", "consoleapi" ] }
winreg = "0.56.0"
is_elevated = "0.1.2"

[build-dependencies]
maxima-resources = { path = "../maxima-resources" }

[[bin]]
name = "maxima-cli"
path = "src/main.rs"
