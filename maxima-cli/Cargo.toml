[package]
name = "maxima-cli"
version = "0.1.0"
authors = ["Sean Kahler <sean@battleda.sh>"]
edition = "2021"

[dependencies]
maxima-lib = { path = "../maxima-lib" }
clap = { version = "4.6.1", features = [ "derive" ] }
tokio = { version = "1.52.3", features = [ "full", "rt", "rt-multi-thread", "time", "net" ] }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
anyhow = "1.0.102"
lazy_static = "1.5.0"
base64 = "0.21.7"
log = "0.4.29"
regex = "1.12.3"
inquire = "0.6.2"
futures = "0.3.32"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [ "memoryapi", "handleapi", "synchapi", "wincon", "consoleapi" ] }
winreg = "0.50.0"
is_elevated = "0.1.2"

[build-dependencies]
maxima-resources = { path = "../maxima-resources" }

[[bin]]
name = "maxima-cli"
path = "src/main.rs"
